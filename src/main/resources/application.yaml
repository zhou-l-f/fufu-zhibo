server:
  port: 9090

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${fufu.datasource.host}:${fufu.datasource.port}/${fufu.datasource.database}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${fufu.datasource.username}
    password: ${fufu.datasource.password}
  data:
    redis:
      host: ${fufu.redis.host}
      port: ${fufu.redis.port}
      database: ${fufu.redis.database}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zlf.fufuzhibo.pojo.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

knife4j:
  banner: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  health:
    rabbit:
      enabled: false
    redis:
      enabled: false

# 自定义配置前缀 fufu
fufu:
  jwt:
    admin-secret-key: ${fufu.jwt.admin-secret-key}
    admin-expire-time: ${fufu.jwt.admin-expire-time}
    admin-token-name: ${fufu.jwt.admin-token-name}

    user-secret-key: ${fufu.jwt.user-secret-key}
    user-expire-time: ${fufu.jwt.user-expire-time}
    user-token-name: ${fufu.jwt.user-token-name}

  crypto:
    aes-key: ${fufu.crypto.aes-key}
    hmac-key: ${fufu.crypto.hmac-key}

  push:
    secret-key: ${fufu.push.secret-key}
    expire-time: ${fufu.push.expire-time}
    reconnect-grace-seconds: ${fufu.push.reconnect-grace-seconds}

  srs:
    callback-secret: ${fufu.srs.callback-secret}
    rtmp-host: ${fufu.srs.rtmp-host}
    rtmp-port: ${fufu.srs.rtmp-port}
    http-port: ${fufu.srs.http-port}
    api-host: ${fufu.srs.api-host}
    api-port: ${fufu.srs.api-port}
    hls-enabled: ${fufu.srs.hls-enabled}
    reconcile-interval-ms: ${fufu.srs.reconcile-interval-ms}
    app: ${fufu.srs.app}
  
  alioss:
    access-key-id: ${fufu.alioss.access-key-id}
    access-key-secret: ${fufu.alioss.access-key-secret}
    bucket-name: ${fufu.alioss.bucket-name}
    endpoint: ${fufu.alioss.endpoint}

